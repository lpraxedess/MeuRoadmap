<head>

  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1020">

  <link rel="stylesheet" href="styles.css?v=20260820-8">

  <script>
    window.__HUB_BOOT__ = true;
    window.addEventListener('error', function (e) {
      var app = document.getElementById('app');
      if (app && !app.hasChildNodes()) {
        app.innerHTML = '<main style="margin:40px;max-width:760px"><div class="eyebrow">BOOT ERROR</div><h1>IAM Career Hub</h1><p style="color:#8d9ab5">A interface não conseguiu iniciar. O erro abaixo permite identificar exatamente o recurso que falhou.</p><pre style="white-space:pre-wrap;background:#11182b;border:1px solid #26324d;border-radius:10px;padding:16px;color:#fb7185">' + String(e.message || e.error || e.filename || 'Erro desconhecido').replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]}) + '</pre></main>';
      }
    }, true);
    (function () {
      var NAV_VERSION = 'iam-hub-navigation-v11';
      if (localStorage.getItem('iam-nav-version') !== NAV_VERSION) {
        localStorage.setItem('iam-nav-version', NAV_VERSION);
        localStorage.removeItem('iam-view');
      }
    })();
  </script>
</head>

  <div id="app"></div>

</body>
