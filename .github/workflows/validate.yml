name: Validate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: |
          node --check app-unified.js
          node --check enhancements.js
      - name: Validate data.js
        run: node --check data.js
      - name: Validate required files
        run: |
          test -f index.html
          test -f styles.css
          test -f guide.css
          test -f clay.css
          test -f enhancements.css
          test -f data.js
          test -f app-unified.js
          test -f enhancements.js
