name: Deploy IAM Career Hub
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Repair generated competency data
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('data/competency-details.js')
          s = p.read_text(encoding='utf-8')
          start = s.index('var map=[') + len('var map=[')
          end = s.index('];', start)
          lines = s[start:end].splitlines()
          fixed = []
          for line in lines:
              t = line.rstrip()
              if not t:
                  fixed.append(t)
                  continue
              # Normalize generated map entries to exactly: [regex, [goal, study, practice, validate, evidence]],
              # Some generated revisions contain one extra closing bracket.
              while t.endswith(']]],'):
                  t = t[:-3] + ']],'
              while t.endswith(']]]'):
                  t = t[:-3] + ']]'
              # Older generated revisions may omit the outer entry bracket.
              if t.startswith('[') and t.endswith(',') and not t.endswith(']],'):
                  t = t[:-1] + ']],'
              elif t.startswith('[') and t.endswith(']') and not t.endswith(']]'):
                  t = t + ']'
              fixed.append(t)
          new = s[:start] + '\n'.join(fixed) + s[end:]
          p.write_text(new, encoding='utf-8')
          PY
          node --check data/competency-details.js
          if ! git diff --quiet -- data/competency-details.js; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/competency-details.js
            git commit -m 'fix: normalize competency map brackets'
            git push
          fi
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in data/*.js app-v5.js certification-ui.js; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4