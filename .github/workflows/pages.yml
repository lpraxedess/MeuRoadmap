name: Deploy IAM Career Hub
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find data -type f -name '*.js' -print0)
          for file in app-v5.js certification-ui-v2.js integrity.js; do
            echo "Checking $file"
            test -f "$file"
            node --check "$file"
          done

      - name: Validate published script references
        shell: bash
        run: |
          set -euo pipefail
          for src in \
            data/roadmap.js \
            data/learning.js \
            data/resources.js \
            data/competency-details.js \
            data/career-audit.js \
            data/certifications.js \
            data/roadmap-extension.js \
            app-v5.js \
            certification-ui-v2.js \
            integrity.js; do
            grep -Fq "$src" index.html
          done
          if grep -Fq 'navigation-fix.js' index.html || grep -Fq 'ui-polish.js' index.html; then
            echo 'Legacy navigation/UI patch detected in index.html'
            exit 1
          fi

      - name: Validate repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f index.html
          test -f data/certifications.js

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
