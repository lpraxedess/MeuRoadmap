name: Deploy IAM Career Hub
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Repair generated competency data
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('data/competency-details.js')
          s = p.read_text(encoding='utf-8')
          start = s.index('var map=[') + len('var map=[')
          end = s.index('];', start)
          block = s[start:end]
          lines = block.splitlines()
          fixed = []
          for line in lines:
              stripped = line.rstrip()
              if stripped:
                  if stripped.endswith(',') and not stripped.endswith('],'):
                      stripped += ']'
                  elif not stripped.endswith(']'):
                      stripped += ']'
              fixed.append(stripped)
          new_block = '\n'.join(fixed)
          s = s[:start] + new_block + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
          node --check data/competency-details.js
          if ! git diff --quiet -- data/competency-details.js; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/competency-details.js
            git commit -m 'fix: repair competency map structure'
            git push
          fi
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in data/*.js app-v5.js certification-ui.js; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
