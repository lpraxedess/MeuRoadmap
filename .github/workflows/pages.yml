name: Deploy IAM Career Hub
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in data/*.js app.js app-v4.js app-v5.js app-v6.js cert-ui-patch.js certification-ui.js certification-ui-v2.js navigation-fix.js progress-ui-patch.js stage.css task-interaction-patch.js today-ui-patch.js ui-fixes-v15.js ui-polish.js; do
            if [[ "$file" == *.js ]]; then
              echo "Checking $file"
              node --check "$file"
            fi
          done
      - name: Validate required entrypoint assets
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s styles.css
          test -s pages.css
          test -s data/roadmap.js
          test -s data/learning.js
          test -s data/certifications.js
          grep -q 'app-v6.js' index.html
          grep -q 'task-interaction-patch.js' index.html
          grep -q 'today-ui-patch.js' index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
