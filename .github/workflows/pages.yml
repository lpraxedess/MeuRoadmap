name: Deploy Cybersecurity Study Hub
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate application JavaScript
        run: |
          set -euo pipefail
          node --check app.js
          node --check data.js
      - name: Validate entrypoint
        run: |
          set -euo pipefail
          test -s index.html
          test -s app.js
          test -s data.js
          test -s styles.css
          grep -q 'app.js' index.html
          grep -q 'data.js' index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
